<svg xmlns="http://www.w3.org/2000/svg" width="490" height="178" viewBox="0 0 490 178" fill="none"><style>@font-face{font-family:JBM400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:SG700;src:url(data:font/woff2;base64,) format('woff2');}
.m4{font-family:JBM400,'JetBrains Mono',Consolas,monospace;font-weight:400}
.m7{font-family:JBM700,'JetBrains Mono',Consolas,monospace;font-weight:700}
.s5{font-family:SG500,'Space Grotesk','Segoe UI',sans-serif;font-weight:500}
.s7{font-family:SG700,'Space Grotesk','Segoe UI',sans-serif;font-weight:700}
.in{opacity:0;animation:in .45s ease-out forwards}
.up{opacity:0;animation:up .6s cubic-bezier(.2,.7,.2,1) forwards}
.blink{animation:blink 1.05s steps(1) infinite}
.breathe{animation:breathe 2.6s ease-in-out infinite}
@keyframes in{to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
</style><defs>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE"/><stop offset=".55" stop-color="#A855F7"/><stop offset="1" stop-color="#F72585"/>
  </linearGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".045"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter></defs><rect x=".5" y=".5" width="489" height="177" rx="16" fill="#0A0C11" stroke="#1F2430"/><rect x=".5" y=".5" width="489" height="177" rx="16" fill="url(#dots)"/><clipPath id="cc"><rect width="490" height="178" rx="16"/></clipPath><rect x="0" y="0" width="490" height="3" fill="url(#neon)" opacity=".8" clip-path="url(#cc)"/><text x="24.0" y="36.0" class="m4" font-size="11.5" fill="#5D6878" >output[2]</text><text x="24.0" y="76.0" class="s7" font-size="22" fill="#8893A4" >awaiting first sync</text><text x="24.0" y="104.0" class="m4" font-size="12.5" fill="#5D6878" >Run the 'profile' workflow once to render</text><text x="24.0" y="124.0" class="m4" font-size="12.5" fill="#5D6878" >your pinned repositories here.</text></svg>