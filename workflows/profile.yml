name: profile

on:
  schedule:
    - cron: "17 0 * * *"        # daily, 05:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build/**", "README.md", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools brotli

      - name: Render SVG kit
        env:
          # Optional: add a classic PAT with read:user as PROFILE_TOKEN to
          # include private contributions. GITHUB_TOKEN works for public data.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build/generate.py

      - name: Commit if anything changed
        run: |
          git config user.name  "profile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || git commit -m "telemetry: refresh $(date -u +%F)"
          git push
