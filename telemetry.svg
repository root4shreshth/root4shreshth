<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" fill="none"><style>@font-face{font-family:JBM700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:JBM400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:SG700;src:url(data:font/woff2;base64,) format('woff2');}
.m4{font-family:JBM400,'JetBrains Mono',Consolas,monospace;font-weight:400}
.m7{font-family:JBM700,'JetBrains Mono',Consolas,monospace;font-weight:700}
